name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the run in flight stale, so that run is
# cancelled; separate PRs still run side by side.
#
# A main push is never stale. The group used to be keyed on the ref for both
# events, so two merges seconds apart shared one group and the second cancelled
# the first: run 23 (d520343, one of a pair of Dependabot merges) was killed six
# seconds in, and that commit has no CI result. Tags are cut by hand from main
# and consumers pin them, so every main commit needs a verdict of its own. A
# main push therefore gets its own group, `github.run_id`, and cancels nothing.
# The cost is one extra run when merges arrive together: typically about 35 s of
# wall time (slow runs have taken 85 s and 2.5 min), and roughly double that in
# runner time because the two jobs run in parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to no permissions; each job opts in to only what it needs.
permissions: {}

jobs:
  build-test:
    name: build, vet, fmt, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      # The tests passing says nothing about whether this file is valid.
      # actionlint checks expressions, job wiring and action inputs, and runs
      # the shellcheck the runner image ships over every run: script. Same
      # version as Passwall-Node and the Report Portal. It compiles cold, about
      # 10 s, until go.sum changes and setup-go saves a cache that holds it.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: go test -race
        run: go test ./... -race -count=1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          repo-checkout: false
